<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfelik{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="{{ url_for('index') }}">👛 Portfelik <span class="badge">wersja 0.1 · prototyp</span></a>
    {% if g.user %}
    <form method="post" action="{{ url_for('auth.logout') }}" class="who">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span>{{ g.user.name }}</span>
      <button class="secondary">Wyloguj</button>
    </form>
    {% endif %}
  </header>

  <main>
    {% for kind, msg in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ kind }}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
